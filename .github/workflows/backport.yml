---
name: Backport
on:
  pull_request_target:
    types: [closed, labeled]

permissions:
  contents: read

jobs:
  backport:
    if: github.repository == 'opensearch-project/opensearch-java'
    uses: opensearch-project/opensearch-build/.github/workflows/backport-pr.yml@eaa7308e0abddc84ab4a061b369b55c7372e836b # main
    secrets:
      OPENSEARCH_CI_BOT_TOKEN: ${{ secrets.OPENSEARCH_CI_BOT_TOKEN }}
