name: Build Distributions

# Builds the AOS and AOSS clients from the committed generated sources
# (src/generated/aos, src/generated/aoss). This does NOT run the code
# generators: the AOS/AOSS distribution specs live in the sibling
# opensearch-api-docs repo, so CI compiles and tests what is committed.

on:
  push:
    branches: [ "main", "[0-9]+.x" ]
  pull_request:
    branches: [ "main", "[0-9]+.x" ]

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.distribution }} (JDK ${{ matrix.java }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        distribution: [ aos, aoss ]
        java: [ 21, 25 ]
    steps:
      - name: Checkout AWS Java Client
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version: ${{ matrix.java }}
          distribution: 'temurin'
          cache: 'gradle'

      - name: Compile ${{ matrix.distribution }} generated client
        run: ./gradlew clean :java-client:compile${{ matrix.distribution == 'aos' && 'Aos' || 'Aoss' }}Java

      - name: Run unit tests
        run: ./gradlew :java-client:unitTest

      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: build-reports-${{ matrix.distribution }}-java${{ matrix.java }}
          path: java-client/build/reports/
          retention-days: 7
