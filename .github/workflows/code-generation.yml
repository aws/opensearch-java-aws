name: Validate AWS Generated Sources

on:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout AWS Java Client
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 21
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          java-version: 21
          distribution: temurin
          cache: gradle

      - name: Compile AOS and AOSS generated sources
        run: ./gradlew :java-client:compileAosJava :java-client:compileAossJava
