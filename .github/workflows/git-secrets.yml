name: "Secret Scan (git-secrets)"

# Pre-merge secret-scan gate. Scans only the new commit range, so cost is
# constant as history grows. Whole-repo, rules-updated scanning is handled by
# GitHub Secret Scanning (enabled on this repository).

on:
  push:
    branches: [ "main", "[0-9]+.x" ]
  pull_request:
    branches: [ "main", "[0-9]+.x" ]

permissions:
  contents: read

jobs:
  git-secrets:
    name: Scan for committed secrets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history so the incoming commit range can be diffed.
          fetch-depth: 0

      - name: Install git-secrets
        env:
          # Pinned to a specific commit so the tool cannot change under us.
          GIT_SECRETS_REF: 7d6b970cbd3c216353cb22b383b70c150140662e # 2025-09-17
        run: |
          git clone https://github.com/awslabs/git-secrets.git "$RUNNER_TEMP/git-secrets"
          git -C "$RUNNER_TEMP/git-secrets" checkout --quiet "$GIT_SECRETS_REF"
          sudo make -C "$RUNNER_TEMP/git-secrets" install

      - name: Register secret patterns
        run: |
          # AWS access key IDs, secret keys, account-in-ARN.
          git secrets --register-aws

          # Private keys. The leading dash is bracketed as [-] so git-secrets'
          # internal grep does not read "-----" as command-line options. The
          # generic pattern ends at "PRIVATE KEY", so the PGP block header
          # (which ends in "BLOCK") needs its own line.
          git secrets --add -- '[-]----BEGIN [A-Z ]*PRIVATE KEY-----'
          git secrets --add -- '[-]----BEGIN PGP PRIVATE KEY BLOCK-----'

          # Sonatype / Nexus publishing token (release artifact signing flow).
          # Character classes keep the keyword case-insensitive.
          git secrets --add -- '[Ss][Oo][Nn][Aa][Tt][Yy][Pp][Ee].{0,20}([Tt][Oo][Kk][Ee][Nn]|[Pp][Aa][Ss][Ss][Ww][Oo][Rr][Dd]|[Pp][Aa][Ss][Ss][Pp][Hh][Rr][Aa][Ss][Ee]).{0,5}[:=].{0,5}[A-Za-z0-9+/=_-]{16,}'
          git secrets --add -- 'NexusUserToken'

          # Central Portal user token, under the Gradle property names release.yml uses.
          git secrets --add -- '[Mm]aven[Cc]entral([Uu]sername|[Pp]assword).{0,5}[:=].{0,5}[A-Za-z0-9+/=_-]{16,}'

          # Allow placeholders (e.g. "${{ secrets.* }}", "your-token-here").
          git secrets --add --allowed -- '[Ss]onatype.{0,20}(\$\{\{|<|xxx|placeholder|example|changeme|your-)'

      # git-secrets' own --scan-history is NOT range-aware: it runs
      # `git log --all` and scans the whole repo across every ref, ignoring any
      # range argument. To scan ONLY what a change introduces, scan the files
      # that change touches with plain `git secrets --scan` instead.

      - name: Scan changed files (pull request)
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          # Files the PR adds/changes, relative to the merge base (three-dot).
          mapfile -t files < <(git diff --name-only --diff-filter=ACM "$BASE...$HEAD")
          [ ${#files[@]} -eq 0 ] && { echo "No files to scan."; exit 0; }
          git secrets --scan -- "${files[@]}"

      - name: Scan changed files (push)
        if: github.event_name == 'push'
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          # On a new branch's first push BEFORE is all-zeros; scan the tip's
          # own files in that case, otherwise the files the push added/changed.
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            mapfile -t files < <(git diff --name-only --diff-filter=ACM "${AFTER}~1" "$AFTER" 2>/dev/null)
          else
            mapfile -t files < <(git diff --name-only --diff-filter=ACM "$BEFORE" "$AFTER")
          fi
          [ ${#files[@]} -eq 0 ] && { echo "No files to scan."; exit 0; }
          git secrets --scan -- "${files[@]}"
