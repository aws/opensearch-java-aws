name: "Secret Scan (git-secrets)"

# AWS-native secret scanning per the AppSec runbook and Aristotle AWS-105
# ("Help Prevent Check-In of Secrets to Git Version Control"). git-secrets is
# free/open-source (awslabs/git-secrets) with no license requirement.
#
# This is a PR/push GATE: each run scans only the new commit range, so it is
# constant-time regardless of history size. Continuous whole-repo, rules-updated
# scanning is provided by GitHub Secret Scanning (enabled on this repository),
# so no scheduled full-history scan is duplicated here.

on:
  push:
    branches: [ "main", "[0-9]+.x" ]
  pull_request:
    branches: [ "main", "[0-9]+.x" ]

permissions:
  contents: read

jobs:
  git-secrets:
    name: Scan for committed secrets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Need both endpoints of the incoming commit range present locally so
          # the range can be diffed. Scanning is scoped to that range (steps
          # below), so cost stays constant as history grows.
          fetch-depth: 0

      - name: Install git-secrets
        run: |
          git clone --depth 1 https://github.com/awslabs/git-secrets.git "$RUNNER_TEMP/git-secrets"
          sudo make -C "$RUNNER_TEMP/git-secrets" install

      - name: Register secret patterns
        run: |
          # AWS provider patterns (access key IDs, secret keys, account-in-ARN).
          git secrets --register-aws
          # Match actual private-key material, not the word "private_key".
          git secrets --add -- '-----BEGIN [A-Z ]*PRIVATE KEY-----'

      - name: Scan new commits (pull request)
        if: github.event_name == 'pull_request'
        run: |
          # Scan only the commits the PR adds, not the whole history.
          git secrets --scan-history ${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}

      - name: Scan new commits (push)
        if: github.event_name == 'push'
        run: |
          BEFORE='${{ github.event.before }}'
          # On a new branch's first push, github.event.before is all-zeros; fall
          # back to scanning just the tip commit rather than the full history.
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            git secrets --scan-history "${{ github.sha }}~1..${{ github.sha }}" 2>/dev/null \
              || git secrets --scan
          else
            git secrets --scan-history "$BEFORE..${{ github.sha }}"
          fi
