name: Release

on:
  push:
    tags:
      - "v*"

# Staging repositories are isolated by IP, so releases must never upload in parallel.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Publish the release
    if: github.repository == 'aws/opensearch-java-aws'
    runs-on: ubuntu-latest
    # Configure required reviewers and MAVEN_CENTRAL_SIGNING_ROLE on this environment.
    # The role's OIDC trust policy must require this repository and environment.
    environment: release
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Full history so the tagged commit can be checked against main.
          fetch-depth: 0
      - name: Require the tagged commit to be on main
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "Tag '${GITHUB_REF_NAME}' points to ${GITHUB_SHA}, which is not on main." >&2
            exit 1
          fi
      - name: Set up Java 8 for client tests
        id: java8
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: '8'
          distribution: 'temurin'
      - name: Set up JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: '21'
          distribution: 'temurin'
          # No Gradle cache: a release is built once, and a cache shared with
          # unprivileged workflows would be an input to the job that signs it.
      - name: Resolve the release version
        id: get_data
        run: |
          version=$(grep "systemProp.version" gradle.properties | tr -d " " | cut -d '=' -f2)
          if [ -z "$version" ]; then
            echo "Could not read systemProp.version from gradle.properties" >&2
            exit 1
          fi
          # The tag must match the version being published, or the drafted GitHub
          # release and the artifacts on Maven Central would disagree.
          if [ "${GITHUB_REF_NAME#v}" != "$version" ]; then
            echo "Tag '${GITHUB_REF_NAME}' does not match systemProp.version '${version}'." >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Run unit tests
        env:
          VERSION: ${{ steps.get_data.outputs.version }}
          JAVA8_HOME: ${{ steps.java8.outputs.path }}
        run: ./gradlew --no-daemon -Dorg.gradle.java.installations.fromEnv=JAVA8_HOME :java-client:test :java-client:java8Test
      - name: Assume the release role
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6
        with:
          role-to-assume: ${{ secrets.MAVEN_CENTRAL_SIGNING_ROLE }}
          aws-region: us-west-2
      - name: Build, sign and publish to Central Portal
        shell: bash
        env:
          VERSION: ${{ steps.get_data.outputs.version }}
        run: |
          echo "Releasing version: $VERSION"

          # Keep credentials scoped to this step and pass them to Gradle through the environment.
          get() { aws secretsmanager get-secret-value --secret-id "$1" --output json \
                    | jq -re .SecretString; }

          ORG_GRADLE_PROJECT_signingInMemoryKey=$(get opensearch-java/release/gpg-signing-key)
          # Register every non-empty line of the armored key before running other tools.
          while IFS= read -r signing_key_line; do
            signing_key_line=${signing_key_line%$'\r'}
            [ -z "$signing_key_line" ] && continue
            signing_key_line=${signing_key_line//'%'/'%25'}
            printf '::add-mask::%s\n' "$signing_key_line"
          done <<< "$ORG_GRADLE_PROJECT_signingInMemoryKey"
          unset signing_key_line
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword=$(get opensearch-java/release/gpg-passphrase)
          portal=$(get opensearch-java/release/central-portal-token)
          ORG_GRADLE_PROJECT_mavenCentralUsername=$(jq -re .username <<<"$portal")
          ORG_GRADLE_PROJECT_mavenCentralPassword=$(jq -re .token <<<"$portal")
          unset portal

          for v in "$ORG_GRADLE_PROJECT_signingInMemoryKeyPassword" "$ORG_GRADLE_PROJECT_mavenCentralUsername" "$ORG_GRADLE_PROJECT_mavenCentralPassword"; do
            echo "::add-mask::$v"
          done
          export ORG_GRADLE_PROJECT_signingInMemoryKey ORG_GRADLE_PROJECT_signingInMemoryKeyPassword
          export ORG_GRADLE_PROJECT_mavenCentralUsername ORG_GRADLE_PROJECT_mavenCentralPassword

          # The vanniktech plugin uploads the signed artifacts to the Central Portal and
          # leaves the deployment USER_MANAGED, so a maintainer publishes it from the
          # Portal UI. No separate manual transfer step is needed.
          ./gradlew --no-daemon :java-client:publishToMavenCentral
          echo "Deployment uploaded to Central Portal for validation and manual publication."
      - name: Drop AWS credentials before third-party steps
        run: |
          for v in AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY AWS_SESSION_TOKEN; do
            echo "$v=" >> "$GITHUB_ENV"
          done
      - name: Draft a release
        uses: ncipollo/release-action@339a81892b84b4eeb0f6e744e4574d79d0d9b8dd # v1.21.0
        with:
          immutableCreate: true
          generateReleaseNotes: true
          artifacts: "java-client/build/libs/*.jar,java-client/build/libs/*.jar.asc"
          # Publish the draft after a maintainer publishes the deployment in Central Portal.
          draft: true
          prerelease: true
