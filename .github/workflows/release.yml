name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    name: Publish the release
    if: github.repository == 'aws/opensearch-java-aws'
    runs-on: ubuntu-latest
    # Configure required reviewers and MAVEN_CENTRAL_SIGNING_ROLE on this environment.
    # The role's OIDC trust policy must require this repository and environment.
    environment: release
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: '21'
          distribution: 'temurin'
          # No Gradle cache: a release is built once, and a cache shared with
          # unprivileged workflows would be an input to the job that signs it.
      - name: Resolve the release version
        id: get_data
        run: |
          version=$(grep "systemProp.version" gradle.properties | tr -d " " | cut -d '=' -f2)
          if [ -z "$version" ]; then
            echo "Could not read systemProp.version from gradle.properties" >&2
            exit 1
          fi
          # The tag must match the version being published, or the drafted GitHub
          # release and the artifacts on Maven Central would disagree.
          if [ "${GITHUB_REF_NAME#v}" != "$version" ]; then
            echo "Tag '${GITHUB_REF_NAME}' does not match systemProp.version '${version}'." >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Run unit tests
        env:
          VERSION: ${{ steps.get_data.outputs.version }}
        run: ./gradlew --no-daemon :java-client:test
      - name: Assume the release role
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6
        with:
          role-to-assume: ${{ secrets.MAVEN_CENTRAL_SIGNING_ROLE }}
          aws-region: us-west-2
      - name: Build, sign and transfer to Central Portal
        shell: bash
        env:
          VERSION: ${{ steps.get_data.outputs.version }}
        run: |
          echo "Releasing version: $VERSION"

          # Keep credentials scoped to this step and pass them to Gradle through the environment.
          get() { aws secretsmanager get-secret-value --secret-id "$1" --output json \
                    | jq -re .SecretString; }

          ORG_GRADLE_PROJECT_signingKey=$(get opensearch-java/release/gpg-signing-key)
          ORG_GRADLE_PROJECT_signingPassword=$(get opensearch-java/release/gpg-passphrase)
          portal=$(get opensearch-java/release/central-portal-token)
          ORG_GRADLE_PROJECT_centralPortalUsername=$(jq -re .username <<<"$portal")
          ORG_GRADLE_PROJECT_centralPortalToken=$(jq -re .token <<<"$portal")
          unset portal

          for v in "$ORG_GRADLE_PROJECT_signingPassword" "$ORG_GRADLE_PROJECT_centralPortalUsername" "$ORG_GRADLE_PROJECT_centralPortalToken"; do
            echo "::add-mask::$v"
          done
          export ORG_GRADLE_PROJECT_signingKey ORG_GRADLE_PROJECT_signingPassword
          export ORG_GRADLE_PROJECT_centralPortalUsername ORG_GRADLE_PROJECT_centralPortalToken

          ./gradlew --no-daemon :java-client:publishPublishMavenPublicationToCentralStagingRepository

          # Sonatype requires this handoff from the same IP as the artifact uploads.
          portal_authorization=$(printf '%s:%s' "$ORG_GRADLE_PROJECT_centralPortalUsername" "$ORG_GRADLE_PROJECT_centralPortalToken" | base64 | tr -d '\n')
          echo "::add-mask::$portal_authorization"
          printf 'Authorization: Bearer %s\n' "$portal_authorization" |
            curl --fail-with-body --silent --show-error \
              --connect-timeout 30 --max-time 600 \
              --request POST --header @- \
              'https://ossrh-staging-api.central.sonatype.com/manual/upload/defaultRepository/software.amazon.opensearch?publishing_type=user_managed'
          unset portal_authorization
          echo "Deployment transferred to Central Portal for validation and manual publication."
      - name: Draft a release
        uses: ncipollo/release-action@339a81892b84b4eeb0f6e744e4574d79d0d9b8dd
        with:
          immutableCreate: true
          generateReleaseNotes: true
          artifacts: "java-client/build/libs/*.jar,java-client/build/libs/*.jar.asc"
          # Publish the draft after a maintainer publishes the deployment in Central Portal.
          draft: true
          prerelease: true
