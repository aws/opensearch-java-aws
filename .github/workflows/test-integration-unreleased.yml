name: JDK 21 Compatibility

on:
  push:
    branches: [ "main", "[0-9]+.x" ]
  pull_request:
    branches: [ "main", "[0-9]+.x" ]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout AWS Java Client
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          java-version: 21
          distribution: temurin
          cache: gradle

      - name: Run AWS client unit tests
        run: ./gradlew clean :java-client:unitTest -Druntime.java=21
