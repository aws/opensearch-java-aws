name: AOS and AOSS Real Resource Tests

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    env:
      OPENSEARCH_TEST_AOS_ENDPOINT: ${{ secrets.OPENSEARCH_TEST_AOS_ENDPOINT }}
      OPENSEARCH_TEST_AOS_USERNAME: ${{ secrets.OPENSEARCH_TEST_AOS_USERNAME }}
      OPENSEARCH_TEST_AOS_PASSWORD: ${{ secrets.OPENSEARCH_TEST_AOS_PASSWORD }}
      OPENSEARCH_TEST_AOSS_ENDPOINT: ${{ secrets.OPENSEARCH_TEST_AOSS_ENDPOINT }}
    steps:
      - name: Checkout AWS Java Client
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: 21
          distribution: temurin
          cache: gradle

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@cbe3b392738ccf3f987d68400dafcf4b0624a56c # v6
        with:
          role-to-assume: ${{ secrets.AOS_AOSS_TEST_ROLE }}
          aws-region: us-east-1

      - name: Run real-resource smoke tests
        run: ./gradlew :java-client:realResourceTest
