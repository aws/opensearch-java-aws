name: AOS and AOSS Real Resource Tests

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    env:
      OPENSEARCH_TEST_AOS_ENDPOINT: ${{ secrets.OPENSEARCH_TEST_AOS_ENDPOINT }}
      OPENSEARCH_TEST_AOS_USERNAME: ${{ secrets.OPENSEARCH_TEST_AOS_USERNAME }}
      OPENSEARCH_TEST_AOS_PASSWORD: ${{ secrets.OPENSEARCH_TEST_AOS_PASSWORD }}
      OPENSEARCH_TEST_AOSS_ENDPOINT: ${{ secrets.OPENSEARCH_TEST_AOSS_ENDPOINT }}
    steps:
      - name: Checkout AWS Java Client
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version: 21
          distribution: temurin
          cache: gradle

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6
        with:
          role-to-assume: ${{ secrets.AOS_AOSS_TEST_ROLE }}
          aws-region: us-east-1

      - name: Run real-resource smoke tests
        run: ./gradlew :java-client:realResourceTest
