name: Unit

on:
  push:
    branches: [ "main", "[0-9]+.x" ]
  pull_request:
    branches: [ "main", "[0-9]+.x" ]

permissions:
  contents: read

jobs:
  java8:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Java Client
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Java 8 for client tests
        id: java8
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: '8'
          distribution: 'temurin'

      - name: Set up JDK 21 for the build
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Test the packaged client on Java 8
        env:
          JAVA8_HOME: ${{ steps.java8.outputs.path }}
        run: ./gradlew -Dorg.gradle.java.installations.fromEnv=JAVA8_HOME :java-client:java8Test

      - name: Upload Reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: test-reports-java8
          path: java-client/build/reports/
          retention-days: 7

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        java: [ 21, 25 ]
        os: [ubuntu-latest, windows-latest, macOS-latest]
    steps:
      - name: Checkout Java Client
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version: ${{ matrix.java }}
          distribution: 'temurin'
          cache: 'gradle'

      - name: Run Unit Test
        run: ./gradlew clean :java-client:unitTest

      - name: Upload Reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: test-reports-java${{ matrix.java }}-${{ runner.os }}
          path: java-client/build/reports/
          retention-days: 7
