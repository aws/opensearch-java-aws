name: GitHub Actions Security (zizmor)

on:
  push:
    branches:
      - main
      - '[0-9]+.x'
  pull_request:
    branches:
      - main
      - '[0-9]+.x'

permissions:
  contents: read

jobs:
  zizmor:
    name: Scan workflows
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run zizmor
        uses: zizmorcore/zizmor-action@45d7276c9ca790aabd705e31ca99c6185c3e76dd # v0.8.1
        with:
          min-severity: high
          # Dependabot pull requests get a read-only token, so they cannot upload SARIF.
          advanced-security: ${{ github.event.pull_request.user.login != 'dependabot[bot]' }}
          annotations: ${{ github.event.pull_request.user.login == 'dependabot[bot]' }}
        continue-on-error: false
